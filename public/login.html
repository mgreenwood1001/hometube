<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Login - Movie Tube</title>
    <style>
        :root {
            --bg: #0b0c10;
            --surface: #181b22;
            --border: rgba(255,255,255,0.08);
            --text: #f3f4f7;
            --muted: #8d93a3;
            --accent: #f0b429;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background:
                radial-gradient(900px 420px at 15% -10%, rgba(240,180,41,0.16), transparent 50%),
                radial-gradient(700px 380px at 110% 10%, rgba(94,200,192,0.1), transparent 45%),
                var(--bg);
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            background: rgba(18,20,26,0.92);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.4rem 2rem;
            box-shadow: 0 24px 80px rgba(0,0,0,0.45);
        }
        .login-header { text-align: center; margin-bottom: 1.8rem; }
        .login-logo {
            width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 0.9rem;
            border-radius: 12px;
        }
        .login-header h1 { font-size: 1.6rem; letter-spacing: -0.03em; }
        .login-header p { color: var(--muted); margin-top: 0.35rem; }
        .form-group { margin-bottom: 1.1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.88rem; color: var(--muted); }
        .form-group input {
            width: 100%; padding: 0.75rem 0.9rem; background: #0f1116;
            border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 1rem;
        }
        .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(240,180,41,0.16); }
        .error-message {
            background: rgba(239,107,107,0.15); color: #ffb4b4; padding: 0.7rem 0.8rem;
            border-radius: 10px; margin-bottom: 1rem; display: none; font-size: 0.9rem;
        }
        .error-message.show { display: block; }
        .login-button {
            width: 100%; padding: 0.8rem; background: var(--accent); border: none; border-radius: 12px;
            color: #1a1406; font-size: 1rem; font-weight: 700; cursor: pointer;
        }
        .login-button:hover { filter: brightness(1.08); }
        .login-button:disabled { opacity: 0.55; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="/images/logo.png" alt="Movie Tube" class="login-logo">
            <span id="systemName" hidden>Movie Tube</span>
            <p>Sign in to browse your library</p>
        </div>
        <div id="errorMessage" class="error-message"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-button" id="loginButton">Continue</button>
        </form>
    </div>
    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginButton = document.getElementById('loginButton');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.remove('show');
            loginButton.disabled = true;
            loginButton.textContent = 'Signing in...';
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    window.location.href = '/';
                } else {
                    errorMessage.textContent = data.error || 'Invalid username or password';
                    errorMessage.classList.add('show');
                    loginButton.disabled = false;
                    loginButton.textContent = 'Continue';
                }
            } catch (error) {
                errorMessage.textContent = 'Could not reach the server';
                errorMessage.classList.add('show');
                loginButton.disabled = false;
                loginButton.textContent = 'Continue';
            }
        });

        fetch('/api/auth/status').then(res => res.json()).then(data => {
            if (data.authenticated) window.location.href = '/';
        }).catch(() => {});

        fetch('/api/config').then(res => res.json()).then(config => {
            const systemName = config.systemName || 'Movie Tube';
            document.getElementById('systemName').textContent = systemName;
            document.getElementById('pageTitle').textContent = `Login - ${systemName}`;
        }).catch(() => {});
    </script>
</body>
</html>
