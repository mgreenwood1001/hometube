<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Movie Tube - PDF</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/video.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo-link">
                <img src="/images/logo.png" alt="Movie Tube" class="logo-image">
                <span class="logo-text" id="systemName">Movie Tube</span>
            </a>
            <div class="search-container">
                <svg class="search-leading-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Search the library" class="search-input" onkeypress="handleSearchKeyPress(event)">
            </div>
            <a class="icon-btn" href="/?favorites=1" title="Favorites" aria-label="Favorites">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12.1 21.35 10.6 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.6 11.54l-1.3 1.31z"/></svg>
            </a>
        </div>
    </header>

    <div class="video-page-container">
        <div id="loadingMessage" class="loading">Loading PDF...</div>
        <div class="video-main-content" id="pdfMainContent" style="display: none; visibility: hidden;">
            <div class="video-main-section">
                <div id="pdfViewerContainer" class="video-player-wrapper pdf-wrapper">
                    <iframe id="pdfViewer" src="" title="PDF viewer" allow="fullscreen"></iframe>
                    <button type="button" class="player-favorite-btn favorite-btn" id="playerFavoriteButton" onclick="toggleFavorite(this)" title="Add to favorites" hidden></button>
                    <div class="pdf-toolbar">
                        <a id="pdfDownloadLink" href="" download="">Download</a>
                        <a id="pdfOpenLink" href="" target="_blank" rel="noopener">Open</a>
                    </div>
                </div>
                <div class="video-info-section">
                    <h1 id="pdfTitle" class="video-title-large">Loading...</h1>
                    <div class="video-meta-bar">
                        <div class="video-stats">
                            <span id="pdfViews" class="video-views"></span>
                        </div>
                        <div class="video-actions">
                            <button class="action-button favorite-btn" id="favoriteButton" type="button" onclick="toggleFavorite(this)">
                                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12.1 21.35 10.6 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.6 11.54l-1.3 1.31z"/></svg>
                                <span class="favorite-label">Favorite</span>
                            </button>
                            <button class="action-button" type="button" onclick="copyPageLink(this)" title="Copy link">Copy link</button>
                        </div>
                    </div>
                    <div class="video-description-section">
                        <div id="pdfStems" class="video-stems-large"></div>
                    </div>
                </div>
            </div>
            <aside class="related-videos-sidebar">
                <h2 class="related-heading">Related</h2>
                <div id="relatedPdfsList" class="related-videos-list">
                    <p class="loading">Loading related PDFs...</p>
                </div>
            </aside>
            <section class="content-danger-zone" aria-labelledby="removeContentHeading">
                <h2 id="removeContentHeading">Remove from library</h2>
                <p>This permanently deletes the file from disk and removes it from Movie Tube. Scroll was required so this stays out of the way while reading.</p>
                <button type="button" class="action-button danger-button" id="removeContentButton" onclick="removeCurrentMedia(this)">Remove this PDF</button>
                <p class="remove-status" id="removeContentStatus" hidden></p>
            </section>
        </div>
    </div>
    <script>
        fetch('/api/config').then(r => r.json()).then(config => {
            document.getElementById('systemName').textContent = config.systemName || 'Movie Tube';
        }).catch(() => {});
    </script>
    <script src="/favorites.js"></script>
    <script src="/pdf.js"></script>
</body>
</html>
